# Local softphone overlay: Rust voice agent, no carrier.
#
# - Replaces the Node realtime bridge with the Rust `voice-agent serve`, under the same
#   service name, so the dialplan's ws://drachtio-app:3100/media URL is unchanged.
# - Loads a FreeSWITCH profile with NO Telair gateway, so this PC never registers the
#   trunk (only one host may register it).
# - Uses vars.local.xml (generated by scripts/start-local-softphone.ps1, not committed)
#   so softphone audio is advertised on this PC's LAN address.
#
# Usage (from docker/sip-stack), or run scripts/start-local-softphone.ps1:
#   docker compose --env-file ../../.env.sip.stack -f docker-compose.yml -f docker-compose.rust.yml \
#     up -d --build freeswitch drachtio-app
#
# Only `freeswitch` and `drachtio-app` are needed. Kamailio and drachtio-server are
# part of the carrier path and stay stopped.

services:
  freeswitch:
    volumes:
      - ./freeswitch/conf/vars.local.xml:/usr/local/freeswitch/conf/vars.xml:ro
      - ./freeswitch/conf/vars.local.xml:/etc/freeswitch/vars.xml:ro
      - ./freeswitch/conf/sip_profiles/mrf.local.xml:/usr/local/freeswitch/conf/sip_profiles/mrf.xml:ro
      - ./freeswitch/conf/sip_profiles/mrf.local.xml:/etc/freeswitch/sip_profiles/mrf.xml:ro

  drachtio-app:
    image: voice-ai-agent:local
    build:
      context: ../..
      dockerfile: rust/Dockerfile.agent
    depends_on: !override
      - freeswitch
    working_dir: /srv
    command: ["voice-agent", "serve"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
