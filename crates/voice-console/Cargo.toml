[package]
name = "voice-console"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive", "env"] }
futures-util = "0.3.34"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }
voice-brand = { version = "0.1.0", path = "../voice-brand" }
voice-core = { version = "0.1.0", path = "../voice-core" }
voice-sessions = { version = "0.1.0", path = "../voice-sessions" }

[dev-dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
tempfile = "3.27.0"
url = "2.5.9"
wiremock = "0.6.5"
