[package]
name = "voice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18.2"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4"] }
voice-core = { version = "0.1.0", path = "../voice-core" }
voice-sessions = { version = "0.1.0", path = "../voice-sessions" }

[[bin]]
name = "voice"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
